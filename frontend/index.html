<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Ganadero AD - Sistema Inteligente de Gestión Ganadera, Inventario de Animales, Cuadrículas Masivas de Campo y Alertas con IA.">
  <title>Ganadero AD - Gestión y Zootecnia Ganadera</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./public/manifest.webmanifest">
  <link rel="shortcut icon" href="./public/favicon.ico">
  <link rel="icon" type="image/png" href="./public/icon.png">
  <link rel="icon" type="image/svg+xml" href="./public/icon.svg">
  <link rel="apple-touch-icon" href="./public/icon.png">

  <!-- Tailwind CSS Precompilado Local (100% Offline para campo y potreros sin internet) -->
  <link rel="stylesheet" href="./tailwind.min.css">
  <link rel="stylesheet" href="./src/styles.css">

  <!-- SheetJS para lectura offline de archivos Excel (.xlsx, .xls) y CSV -->
  <script src="./xlsx.full.min.js"></script>
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('bovitrack_theme_mode') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
    if (typeof XLSX === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      document.head.appendChild(s);
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .bottom-mobile-nav { box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.12); }
  </style>
</head>
<body class="bovi-theme-body antialiased min-h-screen flex flex-col pb-24 md:pb-6">

  <!-- CONTENEDOR PRINCIPAL BLINDADO (OCULTO HASTA VERIFICAR AUTENTICACIÓN)    -->
  <!-- ====================================================================== -->

  <!-- BARRA SUPERIOR MINIMALISTA PWA (HEADER / NAVBAR)                        -->

        <div>

          <div class="text-[9px] text-slate-600">Rankings, Razas & Cruces</div>
        </div>
      </button>
      <button class="btn-nav-bovi flex items-center gap-2.5 p-3 rounded-2xl bg-slate-800/80 hover:bg-slate-700 active:scale-95 text-slate-600 text-xs font-bold text-left transition cursor-pointer border border-slate-700/50" data-vista="dashboard">
        <span class="text-2xl">📊</span>
        <div>
          <div class="font-black text-slate-600">Finanzas</div>
          <div class="text-[9px] text-slate-600">Costos & Métricas</div>
        </div>
      </button>
      <button class="btn-nav-bovi flex items-center gap-2.5 p-3 rounded-2xl bg-slate-800/80 hover:bg-slate-700 active:scale-95 text-slate-600 text-xs font-bold text-left transition cursor-pointer border border-slate-700/50" data-vista="excel">
        <span class="text-2xl">📤</span>
        <div>
          <div class="font-black text-slate-600">Plantilla Excel</div>
          <div class="text-[9px] text-slate-600">Importar / Exportar</div>
        </div>
      </button>
      <button class="btn-nav-bovi flex items-center gap-2.5 p-3 rounded-2xl bg-purple-900/40 hover:bg-purple-800/50 border border-purple-500/30 active:scale-95 text-purple-700 text-xs font-bold text-left transition cursor-pointer" data-vista="admin">
        <span class="text-2xl">🔐</span>
        <div>
          <div class="font-black text-purple-700">Administración</div>
          <div class="text-[9px] text-purple-700">Empresas & Accesos</div>
        </div>
      </button>
    </div>
  </div>
  </div> <!-- Fin #contenedor-app-segura -->

  <!-- ====================================================================== -->
  <!-- PANTALLA DE AUTENTICACIÓN / LOGIN OBLIGATORIO (EMPRESA + USUARIO + CLAVE)-->
  <!-- ====================================================================== -->
  <div id="pantalla-login" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-4 overflow-y-auto">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden my-auto">
      <!-- HEADER LOGIN -->
      <div class="bg-gradient-to-r from-slate-900 via-purple-950 to-slate-900 p-6 text-slate-800 text-center border-b border-purple-900/40">
        <div class="w-20 h-20 mx-auto rounded-2xl overflow-hidden mb-3 shadow-xl border-2 border-emerald-500/50 flex items-center justify-center bg-slate-900">
          <img src="./public/icon.png" alt="Ganadero AD" class="w-full h-full object-cover">
        </div>
        <h2 class="text-xl font-black tracking-tight">Ganadero AD</h2>
        <p class="text-xs text-purple-700 mt-1">Control Ganadero, Multi-Tenant & Gestión de Campo</p>
      </div>

      <!-- FORMULARIO DE ACCESO (SOLO USUARIO Y CONTRASEÑA) -->
      <form id="form-login" class="p-6 space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Usuario de Acceso *:</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-slate-600 font-mono">@</span>
            <input type="text" id="login-usuario" required placeholder="ej. anuardavid o tu usuario" autocomplete="username" class="w-full pl-8 pr-3 py-2.5 font-mono font-bold rounded-xl border border-slate-300 outline-none bg-slate-50 focus:bg-white focus:border-purple-600 transition">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Clave / Contraseña *:</label>
          <div class="relative">
            <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password" class="w-full pl-3 pr-10 py-2.5 font-mono font-bold rounded-xl border border-slate-300 outline-none bg-slate-50 focus:bg-white focus:border-purple-600 transition">
            <button type="button" id="btn-toggle-login-pass" class="absolute right-3 top-2.5 text-slate-600 hover:text-slate-700 font-bold cursor-pointer" tabindex="-1">
              👁️
            </button>
          </div>
        </div>

        <!-- ERROR FEEDBACK -->
        <div id="login-error-msg" class="p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl font-bold text-xs hidden">
          <!-- Mensaje dinámico de error -->
        </div>

        <button type="submit" id="btn-submit-login" class="w-full py-3 bg-gradient-to-r from-purple-700 to-indigo-700 hover:from-purple-600 hover:to-indigo-600 active:scale-[0.98] text-white font-black text-xs uppercase tracking-wider rounded-xl shadow-lg transition flex items-center justify-center gap-2 cursor-pointer">
          <span>🚀 Iniciar Sesión</span>
        </button>
      </form>
    </div>
  </div>

  <script src="./bundle.js?v=1793897153914"></script>
</body>
</html>
